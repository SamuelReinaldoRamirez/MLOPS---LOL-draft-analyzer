      notes:
        - "Confirmed API env var names from api/app/main.py: CORS_ALLOW_ORIGINS, MODELS_DIR (/app/models), POSTGRES_HOST/PORT/DB/USER/PASSWORD; MLflow no-op for serving."
        - "FOLLOW-UP for the actual deploy (part of T005): baking model_*.pkl into the API image needs an api/Dockerfile change (currently copies only app/); the compose models volume does not exist on a PaaS."

  - id: T010
    type: pm
    assignee: PM
    status: done
    reasoning_hint: default
    objective: "Operator handoff: all credential-free local work is done and verified (UI built + CORS proven + containerized at :8080 + deploy runbook at frontend/DEPLOY.md). Public deploy via Vercel+PaaS (T005) is the only remaining work and needs operator-provided credentials + an api/Dockerfile model-baking change. Await operator: provide credentials to proceed, authorize the api/Dockerfile prep, or pause."
    inputs:
