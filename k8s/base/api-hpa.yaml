# ─────────────────────────────────────────────────────────────────────────────
# HorizontalPodAutoscaler — scales the api Deployment 2→6 on CPU pressure.
# Requires metrics-server in the cluster (`kubectl top` must work). Tune the
# averageUtilization based on real traffic; 70% CPU keeps headroom for
# spiky inference bursts.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lol-draft-api
  namespace: lol-draft
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lol-draft-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # avoid thrashing on transient dips
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
