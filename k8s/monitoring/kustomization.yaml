# ─────────────────────────────────────────────────────────────────────────────
# k8s/monitoring — Prometheus + Grafana (Phase 4 monitoring stack on K8s).
# Aggregated by the root k8s/kustomization.yaml.
#
# The grafana-dashboards ConfigMap is generated from the existing dashboard
# JSON under monitoring/grafana/dashboards/ — no duplication.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lol-draft

resources:
  - prometheus-configmap.yaml
  - prometheus-pvc.yaml
  - prometheus-deployment.yaml
  - grafana-configmap.yaml
  - grafana-pvc.yaml
  - grafana-deployment.yaml

# Build a ConfigMap from the on-disk dashboard JSONs (single source of truth).
# Suffix-hash disabled so Deployments don't need to redeploy when the dashboard
# changes; Grafana's provisioner watches the file and re-applies.
configMapGenerator:
  - name: grafana-dashboards
    files:
      - ../../monitoring/grafana/dashboards/lol_api_overview.json
    options:
      disableNameSuffixHash: true

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: lol-draft-predictor
      app.kubernetes.io/managed-by: kustomize
