      notes:
        - "Public deploy (T005) stays blocked on operator credentials; chosen target recorded there."

  - id: T008
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Containerize the Next.js frontend and add it to docker-compose so `docker compose up` serves the UI alongside the API. Cross-origin (mirrors the chosen Vercel+PaaS prod model): UI served on a free host port, browser calls the API at its host URL, CORS allows the UI origin."
