[pytest]
# Phase-1 unit test suite (runs WITHOUT Docker or a real DB).
# All external dependencies (model loading, PostgreSQL) are mocked / monkeypatched.
testpaths =
    api/tests
    training/tests
python_files = test_*.py
# importlib mode avoids the package-name collision between api/tests and
# training/tests (both leaf dirs) and needs no __init__.py in the test dirs.
addopts = -q --import-mode=importlib
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
