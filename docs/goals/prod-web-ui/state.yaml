      - "api/.dockerignore"
      - "api/models/**"
      - ".gitignore"
      - "scripts/**"
      - "frontend/DEPLOY.md"
    verify:
      - "docker compose build api  (still succeeds with the new COPY)"
      - "docker compose up -d api && curl -sf http://localhost:8000/health  (local still healthy; volume-seeded models still work)"
      - "If source models are stageable: stage them, rebuild, and confirm a fresh container (no volume) has /app/models populated."
    stop_if:
      - "Need files outside allowed_files (especially do NOT change docker-compose.yml volume behavior or api/app/ code)."
      - "The change breaks the local volume-based model loading."
      - "docker build fails twice after a fix attempt."
    receipt:
      result: done
      changed_files:
        - "api/Dockerfile"
        - "api/.dockerignore"
        - "api/models/.gitkeep"
