      - "frontend/vercel.json"
      - "docs/**"
    verify:
      - "Runbook lists exact steps + the env vars to set (NEXT_PUBLIC_API_BASE_URL on Vercel, CORS_ALLOW_ORIGINS on the API) and the operator inputs required."
    stop_if:
