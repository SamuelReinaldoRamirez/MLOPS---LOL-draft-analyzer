# ─────────────────────────────────────────────────────────────────────────────
# Grafana provisioned datasource (PRODUCTION on Fly.io)
# Uses the Prometheus app's PUBLIC HTTPS endpoint (via fly-proxy), NOT .internal:
# the proxy auto-starts the machine on a query, so the dashboard never 502s with
# "no such host" if Prometheus happened to be stopped. ('access: proxy' means
# Grafana's backend makes the request, so this works regardless of the browser.)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: https://lol-draft-prometheus.fly.dev
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
