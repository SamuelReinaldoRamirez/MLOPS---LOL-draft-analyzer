    expected_output:
      - "Operator decision recorded"
      - "On credentials: unblock + execute T005; or on authorization: do the api/Dockerfile model-baking prep"
    receipt:
      result: done
      decision: "Operator chose: prep the API for PaaS now (credential-free api/Dockerfile model-baking). No deploy yet. Vercel+PaaS credentials deferred (T005 stays blocked)."
      finding: "No .pkl files exist in the repo; models are sourced from an external sibling project (../datascientest-lol-draft_analyzer/models) via scripts/seed_models.sh into a docker volume, and api/Dockerfile copies only app/. So PaaS-readiness = make the image bake model_*.pkl staged into the build context."
      spawned_tasks:
