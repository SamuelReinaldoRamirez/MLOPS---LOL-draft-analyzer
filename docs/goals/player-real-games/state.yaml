# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Player real-games: search summoner, view match history, run draft models on real games"
  slug: "player-real-games"
  kind: specific # specific | open_ended | existing_plan | recovery | audit
  tranche: "Continuous execution: discover the real Riot integration + model contract, then ship verified vertical slices (search+select, match history, past-game prediction, live-game prediction) until the full outcome is complete."
  status: done # active | blocked | done
  oracle:
    signal: "User opens the UI, searches+selects a real Riot ID, sees real match history, and gets real draft-model predictions: a past game shows predicted win prob vs actual result, and a live game (when one exists) shows a prediction from the spectator draft — all via the real API + prod model path."
    cadence: "after each Worker package and at final audit"
    final_proof: "Browser walkthrough receipt showing real summoner search -> real history -> past-game prediction (predicted vs actual) and live-game prediction (or graceful no-game state), all hitting the real API + prod model."
  intake:
    original_request: "Je veux que les users puissent rechercher leur pseudo et le sélectionner, voir leur historique de games et utiliser les modèles sur leurs games réelles."
    interpreted_outcome: "Search/select a real Riot ID, view real match history, and run the deployed draft models on real past games (predicted vs actual) and live games (spectator draft)."
    input_shape: specific # vague | specific | existing_plan | recovery | audit
    audience: "Players who want model insight on their own real games"
    authority: requested # requested | approved | inferred | needs_approval | blocked
    proof_type: demo # test | demo | artifact | metric | review | source_backed_answer | decision
    completion_proof: "Browser walkthrough: real search -> select -> real history -> past-game prediction (vs actual) + live-game prediction (or graceful no-game), served by the real API + prod model."
    likely_misfire: "Mock/static summoner search disconnected from real Riot data; mis-reconstructed draft feeding the model garbage; or shipping only past-games and silently dropping the live-game requirement."
    blind_spots_considered:
      - "Real state of the 'already integrated' Riot API: which endpoints (account-v1, summoner, match-v5 history/detail, spectator-v5 live), region routing, key location, rate limits."
      - "Mapping a match-v5 game's participants/bans to the model's 10-champion draft contract (POST /predict/draft, champion_id_map) with correct team sides."
      - "spectator-v5 only returns data when the player is mid-game -> live slice is intermittently un-demoable; needs a graceful no-live-game state."
      - "Public rate-limit/abuse exposure with a personal Riot key; key must stay server-side."
    existing_plan_facts:
      - "Reuse verified prod-web-ui foundation: Next.js 14 App Router frontend/ (frontend/src/lib/api.ts, NEXT_PUBLIC_API_BASE_URL), FastAPI api/ with POST /predict/draft, CORS, docker-compose."
      - "Separate goal from prod-web-ui (finished except credential-gated public deploy)."
      - "CORRECTED (T001): the 'Riot API already integrated' claim is FALSE — zero Riot integration exists. RIOT_API_KEY is a blank placeholder marked OUT OF SCOPE. The whole data path (search, history, past-game, live) must be built from scratch."
      - "MODEL CONTRACT (T002): POST /predict/draft takes 10 champion DISPLAY NAMES by role slot (blue_top..red_support), NOT IDs; no bans/puuid field. champion_id_map.json (172 champs, name->{id,name}) needs a REVERSE id->name index for match reconstruction. Central risk: role-slot assignment (match-v5 teamPosition can be empty; spectator-v5 has none)."
      - "CREDENTIAL: a real RIOT_API_KEY is now an operator credential, needed ONLY for live end-to-end verification. All client/routes/reconstruction can be built + unit-tested against recorded fixtures without a live key."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  scout: installed
  worker: installed
  judge: installed

visual_board:
  # none | local | unknown
  selected: local
  local:
    status: live # not_requested | starting | live | generated | blocked
    url: "http://goalbuddy.localhost:41737/player-real-games/"
    command: "npx goalbuddy board /Users/elmanssouriaissam/Documents/datascientest/lol/MLOPS/MLOPS---LOL-draft-analyzer/docs/goals/player-real-games"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: default
    objective: "Map the REAL state of the Riot API integration in the repo: endpoints, key config, routing, rate limits, response shapes; confirm wired vs missing."
    receipt:
      result: done
      note: notes/T001-riot-integration-map.md
      summary: "'Riot API already integrated' is FALSE — ZERO Riot integration exists (no account-v1/match-v5/spectator, no api.riotgames.com calls, no X-Riot-Token). RIOT_API_KEY is a blank placeholder marked OUT OF SCOPE (.env.example:50-52). httpx is test-only. Whole data path (search/select, history, past-game detail, live/spectator) is MISSING and must be built from scratch."
      key_facts:
        - "Existing routes only: /health, /models, POST /predict/draft (main.py:354), POST /predict/at/{minute} (main.py:423), /stats/overview (local DB)."
        - "No outbound HTTP client wired; need async client + platform/regional routing + rate-limit/backoff + RIOT_API_KEY read server-side."
      spawned_change: "Board reshaped: T004 now builds the Riot client foundation + summoner search; live end-to-end verification gated on operator RIOT_API_KEY (T010)."

  - id: T002
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: default
    objective: "Map POST /predict/draft contract, match-v5/spectator -> draft mapping, and frontend extension points."
    receipt:
      result: done
      note: notes/T002-model-contract-and-frontend.md
      summary: "POST /predict/draft (main.py:354) takes 10 champion DISPLAY NAMES by role slot (blue_top..red_support; blue=team_100/red=team_200), no bans/puuid; returns winner + blue/red win prob + confidence + model_used + model_accuracy. champion_id_map.json (172, name->{id,name}) needs a REVERSE id->name index. Frontend = Next.js 14 App Router; client at frontend/src/lib/api.ts (NEXT_PUBLIC_API_BASE_URL); single screen at app/page.tsx; reusable ResultPanel."
      key_facts:
        - "CENTRAL RISK = role-slot assignment: match-v5 teamPosition (TOP/JUNGLE/MIDDLE/BOTTOM/UTILITY; adc<-BOTTOM, support<-UTILITY) can be empty; spectator-v5 has NO position at all."
        - "Filter to SR 5v5 queues (400/420/430/440); unknown champ degrades SILENTLY to neutral defaults; bans are display-only (model ignores them)."
        - "Riot key MUST stay server-side (FastAPI backend recommended, reuses champion map + predict) — never NEXT_PUBLIC."

  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Given the corrected reality (NO Riot integration; model wants champion NAMES by role; key is an operator credential), decide the architecture (FastAPI backend Riot client vs Next route handlers — PM recommends FastAPI) and define Slice 1 (T004 = Riot client foundation + summoner search by Riot ID, backend route + frontend screen, unit-tested with recorded fixtures so a live key is NOT required to verify logic). Sequence T005/T006/T007 and confirm the credential-gated boundary (T010)."
    inputs:
      - "T001 receipt + notes/T001-riot-integration-map.md"
      - "T002 receipt + notes/T002-model-contract-and-frontend.md"
      - "goal.md non-negotiable constraints (real data, real model, key server-side)"
    constraints:
      - "Do not implement."
      - "Pick the largest safe useful vertical slice with clear allowed_files, verify commands (must be runnable WITHOUT a live Riot key — use fixtures/mocks for the Riot HTTP layer only, never mock the search result shown to the user in the real flow), and stop conditions."
      - "Keep the Riot key server-side; honor no-mock-in-shipped-flow."
      - "Decide the role-slot assignment strategy (teamPosition + fallback) as an explicit Slice-1 or Slice-3 concern."
    expected_output:
      - "Architecture decision (where the Riot client lives) + rationale"
      - "Exact Worker objective for T004 (Slice 1)"
      - "allowed_files"
      - "verify (no-live-key)"
      - "stop_if"
      - "Sequencing + any reshaping of T005/T006/T007"
    receipt:
      result: done
      decision: "FastAPI backend (api/) hosts the Riot client — reuses champion_id_map + the in-process predict path, key stays server-side (never NEXT_PUBLIC), one backend + existing CORS. A Next route-handler proxy would duplicate reconstruction and still need a Node-side key. No override risk found."
      full_outcome_complete: false
      rationale: "Slice 1 (T004) = real vertical (GET /riot/summoner + frontend search/select screen) PLUS a unit-tested shared draft-reconstruction util that T006/T007 reuse. All verifiable WITHOUT a live key by mocking only the Riot HTTP transport against recorded real shapes. Search-only would be too thin; pulling history/predict in would sprawl scope."
      shared_components: "api/app/draft_reconstruction.py = single source of truth for match->draft: reverse championId->name index (from champion_id_map.json) + role-slot strategy (teamPosition adc<-BOTTOM/support<-UTILITY + deterministic fallback for empty/UNKNOWN and spectator-v5 no-position). Built+tested in T004; reused unchanged by T006/T007."
      note: "httpx must move from test-only to a PROD dep in api/requirements.txt (already in T004 allowed_files; not a scope expansion). Grounded in api/app/main.py single-file app, api/tests/conftest.py fixture pattern, frontend Next 14 App Router."

