# ─────────────────────────────────────────────────────────────────────────────
# Grafana provisioning — datasource + dashboard provider.
#
# The Prometheus URL points at the in-cluster Service. The dashboard provider
# tells Grafana to scan /var/lib/grafana/dashboards (a separate ConfigMap
# `grafana-dashboards` mounted there carries the actual JSON, generated by
# kustomize's `configMapGenerator` from monitoring/grafana/dashboards/).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: lol-draft
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.lol-draft.svc.cluster.local:9090
        isDefault: true
        editable: false

  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: lol-draft
        orgId: 1
        folder: ""
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
