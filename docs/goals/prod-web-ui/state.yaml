      - "docker compose up -d frontend && curl -sf -o /dev/null -w '%{http_code}' http://localhost:8080  (expect 200)"
      - "curl -i -X OPTIONS http://localhost:8000/predict/draft -H 'Origin: http://localhost:8080' -H 'Access-Control-Request-Method: POST'  (expect access-control-allow-origin: http://localhost:8080)"
      - "cd frontend && npm run build  (still passes)"
