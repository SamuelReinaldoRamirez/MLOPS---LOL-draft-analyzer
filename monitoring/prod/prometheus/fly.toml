# Fly.io — Prometheus (PRODUCTION monitoring for the LoL Draft Predictor API).
#
# Scrapes the public Fly API /metrics. Exposes an HTTP service on 9090 with
# auto_stop DISABLED + min_machines_running=1 so the machine stays ALWAYS-ON
# (a service-less Fly app gets auto-stopped, which breaks scraping + the Grafana
# datasource). Grafana reads it at https://lol-draft-prometheus.fly.dev.
#
# Deploy:  cd monitoring/prod/prometheus && fly deploy
# NOTE: TSDB is ephemeral (no volume) — metrics history resets on redeploy.
# NOTE: the endpoint is public + unauthenticated (read-only, low-sensitivity API
#       request metrics). Add basic_auth via --web.config.file to lock it down.
app = "lol-draft-prometheus"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 9090
  force_https = true
  # "off" (not boolean false) is the value Fly honors to never auto-stop; keep at
  # least one machine running so scraping is continuous. auto_start is a safety
  # net so a query still wakes it if it ever does stop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
