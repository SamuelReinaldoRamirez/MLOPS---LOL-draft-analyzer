      next_action: "Operator selects a hosting target and provides credentials; then this task unblocks into a concrete deploy plan + CORS_ALLOW_ORIGINS set to the public frontend URL."

  - id: T007
    type: pm
    assignee: PM
    status: done
    reasoning_hint: default
    objective: "Drive the go-live path. Immediate input: operator deployment decision (which the PM is escalating now). Based on the answer, do the chosen safe local work and/or unblock T005: (a) containerize the frontend + add it to docker-compose so the whole stack runs with one command at a single origin (no credentials needed); (b) capture a one-shot Playwright browser walkthrough to fully close the local visual oracle; (c) prepare platform deploy config (Vercel/PaaS/VPS/k8s) and set CORS_ALLOW_ORIGINS to the public URL once credentials are provided."
    inputs:
      - "T999 audit receipt"
      - "T002 deploy-surface receipt"
      - "Operator deployment decision (pending)"
    constraints:
      - "Local containerization + browser walkthrough need no operator input and are safe to do now if chosen."
      - "Actual public deploy needs operator credentials (T005)."
    expected_output:
      - "Chosen path recorded"
      - "Local artifacts built/verified, or T005 unblocked with a concrete deploy plan"
    receipt:
      result: done
      decision: "Operator chose: containerize the frontend into docker-compose now (safe, no credentials). Eventual public hosting target = Vercel (frontend) + PaaS API (Render/Railway/Fly/Cloud Run)."
      rationale: "Local containerization gives immediate 'docker compose up serves the UI' value and mirrors the chosen Vercel+PaaS cross-origin architecture (UI and API on separate origins, CORS on), so it is a clean stepping stone rather than throwaway work."
      spawned_tasks:
