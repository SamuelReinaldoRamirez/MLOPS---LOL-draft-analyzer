# ─────────────────────────────────────────────────────────────────────────────
# Grafana provisioned datasource (PRODUCTION on Fly.io)
# Reaches Prometheus over Fly's private 6PN network. Reliable now that the
# Prometheus app is always-on (min_machines_running=1) — .internal resolves to a
# running instance, with no dependency on public DNS/cert propagation.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://lol-draft-prometheus.internal:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
