  - id: T011
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Make the API image PaaS-ready by baking model_*.pkl from the build context into /app/models, without breaking local docker-compose (which still uses the seeded volume). Add a build-context models dir + ignore rules + a staging helper, and document the flow."
    allowed_files:
