# Fly.io — Prometheus Pushgateway (PRODUCTION).
#
# A sink for batch-job metrics (the drift job pushes lol_drift_share here);
# Prometheus scrapes it. Always-on so Prometheus always sees the latest push.
# In-memory (no volume) — re-push after a redeploy.
#
# Deploy:  cd monitoring/prod/pushgateway && fly deploy
app = "lol-draft-pushgateway"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 9091
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
