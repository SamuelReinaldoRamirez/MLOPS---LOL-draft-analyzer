# ─────────────────────────────────────────────────────────────────────────────
# Grafana dashboard provider (Phase 4)
# Loads every dashboard JSON dropped into /var/lib/grafana/dashboards.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: 1

providers:
  - name: lol-draft-dashboards
    orgId: 1
    folder: LoL Draft Predictor
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
