# ─────────────────────────────────────────────────────────────────────────────
# Secret TEMPLATE — placeholder values only. Never commit real credentials.
#
# Two recommended ways to use this in a real cluster:
#   1) Replace stringData values with real ones in an out-of-tree overlay (e.g.
#      `k8s/overlays/prod/secret.yaml`) that is NEVER committed.
#   2) Better: switch to a SealedSecret (Bitnami) or ExternalSecrets pointing
#      at AWS Secrets Manager / GCP Secret Manager / Vault.
#
# Used by every Deployment via `envFrom: secretRef: name: lol-draft-secrets`.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: lol-draft-secrets
  namespace: lol-draft
type: Opaque
stringData:
  # Postgres — keep in sync with the StatefulSet's POSTGRES_PASSWORD env.
  POSTGRES_PASSWORD: "change_me_in_cluster_secrets"

  # Grafana admin credentials (only consumed by the Grafana Deployment, but
  # kept here for a single source of truth; the manifest reads them via
  # secretKeyRef so unrelated pods don't see them).
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: "change_me_in_cluster_secrets"

  # Riot Games API key — empty by default; the API returns a clear 503 +
  # "Riot API key not configured" until a real key is injected.
  RIOT_API_KEY: ""
