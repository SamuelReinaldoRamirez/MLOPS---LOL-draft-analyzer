# ─────────────────────────────────────────────────────────────────────────────
# CI — LoL Draft Predictor (Phase 3)
#
# Three jobs, reusing the commands that already work locally:
#   1. lint   — ruff (NON-blocking first pass; existing code not rewritten)
#   2. test   — pytest suite (runs WITHOUT Docker or DB; models/DB are mocked,
#               so CI never needs the 747 MB database/lol_draft.dump)
#   3. build  — `docker compose build` to prove every service image builds
#
# Notes:
#   * No secrets / Riot API key required: the test suite is fully mocked and the
#     image build does not pull the dump (it is git-ignored and not in context).
#   * `.env` is generated from `.env.example` so `docker compose` interpolation
#     does not warn about missing variables.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint (ruff) ─────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # Non-blocking first pass: report findings but do not fail the build on
      # pre-existing Phase 1/2 lint debt. Tighten (drop --exit-zero) in a later
      # phase. Config lives in .ruff.toml.
      - name: Ruff check
        run: ruff check . --output-format=github --exit-zero

  # ── 2. Unit tests (pytest, no Docker/DB) ────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The suite imports both the API app and the training scripts; install
      # both requirement sets (they include pytest + httpx).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r training/requirements.txt

      - name: Run pytest
        run: python -m pytest -q

  # ── 3. Docker image build ───────────────────────────────────────────────────
  build:
    name: Docker build
    runs-on: ubuntu-latest
    # Only spend build minutes once tests pass.
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # docker compose interpolates ${VAR} from .env; provide placeholders so
      # `docker compose build` does not emit "variable is not set" warnings.
      - name: Prepare .env
        run: cp .env.example .env

      # Builds every service image (api, streamlit, mlflow, training, postgres).
      # No DB dump is needed for the build — it is git-ignored and not copied
      # into any image context.
      - name: Build all service images
        run: docker compose build
